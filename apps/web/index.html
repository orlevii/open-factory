<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <meta name="color-scheme" content="light dark" />
    <link rel="icon" href="/favicon.ico" sizes="48x48" />
    <link rel="icon" href="/favicon.svg" type="image/svg+xml" />
    <meta name="theme-color" content="#F2F4F5" />
    <script>
      // Resolve the theme before first paint so there is no flash. Mirrors src/lib/theme.ts:
      // the "of-theme" key holds "light" or "dark"; absent means follow the system.
      (() => {
        let pref = null;
        try {
          pref = localStorage.getItem("of-theme");
        } catch {}
        const dark =
          pref === "dark" ||
          (pref !== "light" && matchMedia("(prefers-color-scheme: dark)").matches);
        const theme = dark ? "dark" : "light";
        document.documentElement.dataset.theme = theme;
        document.documentElement.style.colorScheme = theme;
        document
          .querySelector('meta[name="theme-color"]')
          .setAttribute("content", dark ? "#15171A" : "#F2F4F5");
      })();
    </script>
    <title>Open Factory</title>
  </head>
  <body>
    <div id="root"></div>
    <script type="module" src="/src/main.tsx"></script>
  </body>
</html>
